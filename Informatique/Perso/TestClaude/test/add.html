<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une Recette</title>
    <meta name="description" content="Ajoutez une nouvelle recette de cuisine">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b6b">
</head>
<body>
    <!-- Skip link pour l'accessibilité -->
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <header role="banner">
        <nav role="navigation" aria-label="Navigation principale">
            <div class="logo">🍳 Mes Recettes</div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="recipes.html">Recettes</a></li>
                <li><a href="add.html" class="active" aria-current="page">Ajouter</a></li>
            </ul>
            <div class="nav-actions">
                <button id="dark-mode-toggle" aria-label="Basculer le mode sombre">🌙 Mode sombre</button>
            </div>
        </nav>
    </header>

    <main id="main-content" class="add-page" role="main">
        <h1 id="form-title">Ajouter une nouvelle recette</h1>

        <form id="recipe-form" class="recipe-form" novalidate aria-labelledby="form-title">
            <div class="form-group">
                <label for="title">Nom de la recette *</label>
                <input type="text" id="title" name="title" required minlength="3" aria-required="true" aria-describedby="title-error">
            </div>

            <div class="form-group">
                <label for="category">Catégorie *</label>
                <select id="category" name="category" required aria-required="true">
                    <option value="">Sélectionner...</option>
                    <option value="entrée">Entrée</option>
                    <option value="plat">Plat principal</option>
                    <option value="dessert">Dessert</option>
                    <option value="apéritif">Apéritif</option>
                    <option value="snack">Snack</option>
                    <option value="boisson">Boisson</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="prep-time">Temps de préparation (min)</label>
                    <input type="number" id="prep-time" name="prep-time" min="0" value="0">
                </div>

                <div class="form-group">
                    <label for="cook-time">Temps de cuisson (min)</label>
                    <input type="number" id="cook-time" name="cook-time" min="0" value="0">
                </div>

                <div class="form-group">
                    <label for="servings">Nombre de parts</label>
                    <input type="number" id="servings" name="servings" min="1" value="4">
                </div>
            </div>

            <div class="form-group">
                <label for="recipe-image">Photo de la recette</label>
                <div class="image-upload" onclick="document.getElementById('recipe-image').click()">
                    <p>📷 Cliquez pour ajouter une photo</p>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Max 500KB - Formats: JPG, PNG, WebP</p>
                    <input type="file" id="recipe-image" name="recipe-image" accept="image/*">
                </div>
                <img id="image-preview" class="image-preview" style="display: none;" alt="Aperçu">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="Décrivez votre recette en quelques mots..."></textarea>
            </div>

            <div class="form-group">
                <label for="ingredients">Ingrédients *</label>
                <textarea id="ingredients" name="ingredients" rows="6" required placeholder="Un ingrédient par ligne&#10;Ex: 200g de farine&#10;3 œufs&#10;100ml de lait" aria-required="true"></textarea>
            </div>

            <div class="form-group">
                <label for="instructions">Instructions *</label>
                <textarea id="instructions" name="instructions" rows="8" required placeholder="Étapes de préparation&#10;Ex: 1. Préchauffer le four à 180°C&#10;2. Mélanger les ingrédients secs&#10;3. Ajouter les œufs un par un..." aria-required="true"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Enregistrer la recette</button>
                <a href="recipes.html" class="btn-secondary">Annuler</a>
            </div>
        </form>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Mes Recettes - Tous droits réservés</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
