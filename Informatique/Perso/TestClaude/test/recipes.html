<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes les Recettes</title>
    <meta name="description" content="Parcourez toutes vos recettes de cuisine">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b6b">
</head>
<body>
    <!-- Skip link pour l'accessibilité -->
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <header role="banner">
        <nav role="navigation" aria-label="Navigation principale">
            <div class="logo">🍳 Mes Recettes</div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="recipes.html" class="active" aria-current="page">Recettes</a></li>
                <li><a href="add.html">Ajouter</a></li>
            </ul>
            <div class="nav-actions">
                <button id="dark-mode-toggle" aria-label="Basculer le mode sombre">🌙 Mode sombre</button>
            </div>
        </nav>
    </header>

    <main id="main-content" class="recipes-page" role="main">
        <h1>Toutes les Recettes</h1>

        <!-- Barre de recherche -->
        <div class="search-bar" role="search">
            <input type="text" id="search-input" placeholder="Rechercher une recette, un ingrédient..." aria-label="Rechercher une recette">
            <select id="category-filter" aria-label="Filtrer par catégorie">
                <option value="">Toutes les catégories</option>
                <option value="entrée">Entrée</option>
                <option value="plat">Plat principal</option>
                <option value="dessert">Dessert</option>
                <option value="apéritif">Apéritif</option>
                <option value="snack">Snack</option>
                <option value="boisson">Boisson</option>
            </select>
        </div>

        <!-- Barre de filtres et actions -->
        <div class="filters-bar">
            <label for="sort-select">
                <span>Trier par :</span>
                <select id="sort-select" aria-label="Trier les recettes">
                    <option value="date">Date d'ajout</option>
                    <option value="name">Nom (A-Z)</option>
                    <option value="time">Temps total</option>
                </select>
            </label>

            <label>
                <input type="checkbox" id="favorites-filter">
                <span>Mes favoris uniquement</span>
            </label>

            <div style="margin-left: auto; display: flex; gap: 0.5rem;">
                <button id="export-btn" class="btn-secondary" aria-label="Exporter les recettes">
                    📥 Exporter
                </button>
                <label class="btn-secondary" style="cursor: pointer; margin: 0;" aria-label="Importer des recettes">
                    📤 Importer
                    <input type="file" id="import-input" accept=".json" style="display: none;">
                </label>
            </div>
        </div>

        <!-- Grille des recettes -->
        <div id="recipes-container" class="recipe-grid" role="list"></div>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Mes Recettes - Tous droits réservés</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
