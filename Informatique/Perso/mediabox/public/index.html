<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080810;--s1:#0f0f1a;--s2:#161625;--s3:#1e1e30;--s4:#26263c;
  --acc:#e8445a;--acc2:#ff7088;--acc3:#ff9aaa;
  --blue:#4a9eff;--green:#2ecc71;--gold:#f9c74f;--purple:#a78bfa;
  --t1:#f0f0fa;--t2:#9090b8;--t3:#55557a;--t4:#333350;
  --r:10px;--r2:16px;--r3:24px;
  --font:'Outfit',sans-serif;--font2:'Playfair Display',serif;
  --hero-color: #e8445a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px}

/* ── HEADER ── */
header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:60px;
  display:flex;align-items:center;gap:1.5rem;padding:0 1.5rem;
  background:rgba(8,8,16,0.85);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.05);
  transition:background .3s;
}
.logo{
  font-size:1.4rem;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  cursor:pointer;flex-shrink:0;text-transform:uppercase;
}
.logo span{font-weight:300;opacity:.7}
nav{display:flex;gap:.15rem;flex:1}
.nav-btn{
  background:none;border:none;color:var(--t3);font-family:var(--font);
  font-size:.8rem;font-weight:600;padding:.45rem .9rem;border-radius:20px;
  cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase;
}
.nav-btn:hover{color:var(--t1);background:rgba(255,255,255,.06)}
.nav-btn.active{color:var(--t1);background:rgba(232,68,90,.15);color:var(--acc2)}
.header-right{display:flex;align-items:center;gap:.75rem;margin-left:auto}
.search-wrap{position:relative}
.search-input{
  background:var(--s2);border:1px solid rgba(255,255,255,.07);color:var(--t1);
  padding:.45rem .9rem .45rem 2.2rem;border-radius:20px;font-size:.82rem;
  font-family:var(--font);outline:none;width:200px;transition:all .2s;
}
.search-input:focus{width:260px;border-color:rgba(232,68,90,.4);background:var(--s3)}
.search-input::placeholder{color:var(--t3)}
.search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.btn-surprise{
  background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;color:white;
  padding:.45rem 1rem;border-radius:20px;font-size:.78rem;font-weight:700;
  cursor:pointer;transition:all .15s;letter-spacing:.5px;white-space:nowrap;
  display:flex;align-items:center;gap:.4rem;
}
.btn-surprise:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(168,85,247,.4)}
.btn-src{
  background:var(--s2);border:1px solid rgba(255,255,255,.07);color:var(--t2);
  padding:.45rem .9rem;border-radius:20px;font-size:.78rem;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:.4rem;
}
.btn-src:hover{background:var(--s3);color:var(--t1)}

/* ── MAIN ── */
main{padding-top:68px;min-height:100vh}

/* ── HERO ── */
.hero{
  position:relative;height:520px;overflow:hidden;
  transition:background .8s ease;
}
.hero-backdrop{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 100% at 30% 50%, var(--hero-color) 0%, transparent 60%);
  opacity:.15;transition:all .8s;
}
.hero-poster-side{
  position:absolute;right:8%;top:50%;transform:translateY(-50%);
  width:220px;aspect-ratio:2/3;border-radius:var(--r2);overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.7),-20px 0 60px rgba(0,0,0,.4);
  transition:all .6s;
}
.hero-poster-side img{width:100%;height:100%;object-fit:cover}
.hero-poster-placeholder{
  width:100%;height:100%;background:var(--s3);
  display:flex;align-items:center;justify-content:center;
  font-size:4rem;opacity:.3;
}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,16,.97) 30%,rgba(8,8,16,.4) 70%,rgba(8,8,16,.1) 100%)}
.hero-gradient-bottom{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,var(--bg),transparent)}
.hero-content{position:relative;padding:0 3rem;max-width:600px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:1rem}
.hero-badge{display:flex;align-items:center;gap:.5rem}
.hero-tag{background:var(--acc);color:white;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:.3rem .75rem;border-radius:4px}
.hero-rating{display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:var(--gold);font-weight:600}
.hero-title{font-family:var(--font);font-size:3.2rem;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.hero-overview{color:var(--t2);font-size:.88rem;line-height:1.65;max-width:460px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{display:flex;align-items:center;gap:.75rem;font-size:.78rem;color:var(--t3)}
.hero-meta-sep{opacity:.3}
.hero-actions{display:flex;gap:.75rem;flex-wrap:wrap}
.btn-play{
  background:var(--acc);color:white;border:none;padding:.8rem 1.8rem;border-radius:var(--r);
  font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;
  transition:all .15s;letter-spacing:.3px;
}
.btn-play:hover{background:var(--acc2);transform:scale(1.03)}
.btn-ghost{
  background:rgba(255,255,255,.08);color:var(--t1);border:1px solid rgba(255,255,255,.12);
  padding:.8rem 1.4rem;border-radius:var(--r);font-weight:600;font-size:.85rem;
  cursor:pointer;display:flex;align-items:center;gap:.5rem;transition:all .15s;
}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-ghost.fav-active{border-color:var(--gold);color:var(--gold)}
.btn-ghost.watched-active{border-color:var(--green);color:var(--green)}

/* ── CONTINUE ROW ── */
.continue-section{padding:1.5rem 2rem 0}
.section-label{
  font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--t3);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;
}
.section-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.continue-row{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none}
.continue-row::-webkit-scrollbar{display:none}
.continue-card{
  flex-shrink:0;width:220px;background:var(--s2);border-radius:var(--r);overflow:hidden;
  cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.05);
  position:relative;
}
.continue-card:hover{transform:scale(1.03);border-color:rgba(255,255,255,.12)}
.continue-thumb{height:110px;overflow:hidden;position:relative;background:var(--s3)}
.continue-thumb img{width:100%;height:100%;object-fit:cover}
.continue-thumb-placeholder{height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:.2}
.continue-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,.5)}
.continue-progress-fill{height:100%;background:var(--acc);transition:width .3s}
.continue-info{padding:.6rem .75rem}
.continue-title{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue-meta{font-size:.7rem;color:var(--t3);margin-top:.2rem}
.continue-play-icon{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-65%);
  background:rgba(232,68,90,.9);border-radius:50%;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
.continue-card:hover .continue-play-icon{opacity:1}

/* ── GRID SECTION ── */
.grid-section{padding:2rem 2rem 0}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.section-title{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:.75rem}
.section-count{background:var(--s3);color:var(--t3);font-size:.7rem;padding:.2rem .6rem;border-radius:10px;font-weight:500}
.sort-select{background:var(--s2);border:1px solid rgba(255,255,255,.07);color:var(--t2);padding:.35rem .75rem;border-radius:var(--r);font-size:.75rem;font-family:var(--font);cursor:pointer;outline:none}
.sort-select:hover{background:var(--s3)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}

/* ── CARD ── */
.media-card{
  position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;
  background:var(--s2);aspect-ratio:2/3;
  transition:transform .2s,box-shadow .25s;
  border:1px solid rgba(255,255,255,.04);
}
.media-card:hover{transform:scale(1.05) translateY(-4px);box-shadow:0 24px 60px rgba(0,0,0,.7);z-index:5;border-color:rgba(255,255,255,.1)}
.card-poster{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s}
.card-placeholder{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;padding:1rem;background:linear-gradient(135deg,var(--s2),var(--s3));
}
.card-placeholder-icon{font-size:2.5rem;opacity:.2}
.card-placeholder-title{font-size:.78rem;text-align:center;opacity:.5;line-height:1.3;font-weight:600}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(5,5,12,.98) 0%,rgba(5,5,12,.5) 40%,transparent 70%);
  opacity:0;transition:opacity .2s;padding:.75rem;
  display:flex;flex-direction:column;justify-content:flex-end;gap:.3rem;
}
.media-card:hover .card-overlay{opacity:1}
.card-title{font-size:.8rem;font-weight:700;line-height:1.3}
.card-year{font-size:.68rem;color:var(--t3)}
.card-actions{display:flex;gap:.35rem;margin-top:.3rem}
.card-btn{
  flex:1;background:rgba(255,255,255,.1);border:none;color:white;
  padding:.35rem;border-radius:6px;font-size:.65rem;cursor:pointer;
  transition:background .15s;display:flex;align-items:center;justify-content:center;gap:.3rem;
  font-family:var(--font);font-weight:600;
}
.card-btn:hover{background:rgba(255,255,255,.2)}
.card-btn.play-btn{background:var(--acc);flex:2}
.card-btn.play-btn:hover{background:var(--acc2)}
.card-btn.watched-btn.is-watched{background:rgba(46,204,113,.25);color:var(--green)}
.card-btn.fav-btn.is-fav{background:rgba(249,199,79,.2);color:var(--gold)}
.card-play-overlay{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(232,68,90,.9);border-radius:50%;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.media-card:hover .card-play-overlay{opacity:1}
/* Badges */
.badge{position:absolute;border-radius:5px;font-size:.6rem;font-weight:700;padding:.2rem .45rem;letter-spacing:.5px}
.badge-watched{top:7px;right:7px;background:rgba(46,204,113,.9);color:white}
.badge-fav{top:7px;left:7px;color:var(--gold);font-size:.95rem}
.badge-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1)}
.badge-progress-fill{height:100%;background:var(--acc)}
.badge-new{top:7px;right:7px;background:var(--blue);color:white}
.badge-transcoded{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.6);color:var(--t2);font-size:.55rem;padding:.15rem .4rem;border-radius:3px}
.poster-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);pointer-events:none}

/* ── SERIES ── */
.series-block{padding:0 0 2rem}
.series-header{
  display:flex;align-items:center;gap:1rem;padding:.85rem 2rem;cursor:pointer;
  transition:background .15s;border-radius:var(--r);margin:0 .5rem;
}
.series-header:hover{background:rgba(255,255,255,.02)}
.series-poster-mini{
  width:48px;height:72px;border-radius:6px;overflow:hidden;flex-shrink:0;
  background:var(--s3);
}
.series-poster-mini img{width:100%;height:100%;object-fit:cover}
.series-header-info{flex:1}
.series-name{font-size:1.1rem;font-weight:700}
.series-meta-row{display:flex;align-items:center;gap:.5rem;margin-top:.25rem;flex-wrap:wrap}
.series-badge{background:var(--s3);color:var(--t3);font-size:.65rem;padding:.2rem .5rem;border-radius:10px}
.series-progress-badge{background:rgba(232,68,90,.15);color:var(--acc2);font-size:.65rem;padding:.2rem .5rem;border-radius:10px}
.series-rating{color:var(--gold);font-size:.72rem;display:flex;align-items:center;gap:.2rem}
.chevron{color:var(--t3);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(90deg)}
.season-tabs{display:flex;gap:.4rem;padding:.5rem 2rem 1rem;flex-wrap:wrap}
.season-tab{
  background:var(--s3);border:1px solid rgba(255,255,255,.06);color:var(--t2);
  font-size:.75rem;padding:.35rem .9rem;border-radius:20px;cursor:pointer;transition:all .15s;
  font-family:var(--font);font-weight:600;
}
.season-tab.active{background:var(--acc);color:white;border-color:transparent}
.season-tab:hover:not(.active){background:var(--s4);color:var(--t1)}
.episode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.6rem;padding:0 2rem 1rem}
.episode-card{
  display:flex;align-items:center;gap:.75rem;background:var(--s2);border-radius:var(--r);
  padding:.7rem .9rem;cursor:pointer;border:1px solid transparent;transition:all .15s;
  position:relative;overflow:hidden;
}
.episode-card:hover{background:var(--s3);border-color:rgba(255,255,255,.07)}
.episode-card.is-watched{opacity:.65}
.episode-card.is-watched::after{content:'✓';position:absolute;right:.75rem;top:50%;transform:translateY(-50%);color:var(--green);font-size:.85rem;font-weight:700}
.ep-thumb{
  width:80px;height:48px;border-radius:6px;overflow:hidden;flex-shrink:0;
  background:var(--s3);position:relative;
}
.ep-thumb img{width:100%;height:100%;object-fit:cover}
.ep-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;opacity:.2}
.ep-num-overlay{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.8);color:white;font-size:.58rem;font-weight:700;padding:.1rem .3rem;border-radius:3px}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-meta{font-size:.68rem;color:var(--t3);margin-top:.2rem}
.ep-progress-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.07)}
.ep-progress-fill{height:100%;background:var(--acc)}
.ep-play-btn{
  background:none;border:none;color:var(--t3);cursor:pointer;
  transition:color .15s;flex-shrink:0;padding:.2rem;
}
.episode-card:hover .ep-play-btn{color:var(--acc)}
.ep-watched-btn{
  background:none;border:none;cursor:pointer;flex-shrink:0;padding:.2rem;
  color:var(--t4);transition:color .15s;font-size:.85rem;
}
.ep-watched-btn:hover,.ep-watched-btn.active{color:var(--green)}

/* ── STATS PAGE ── */
.stats-page{padding:2rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{
  background:var(--s2);border-radius:var(--r2);padding:1.5rem;
  border:1px solid rgba(255,255,255,.05);
  display:flex;flex-direction:column;gap:.5rem;
}
.stat-value{font-size:2.5rem;font-weight:800;line-height:1}
.stat-label{font-size:.75rem;color:var(--t3);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.stat-sub{font-size:.78rem;color:var(--t2);margin-top:.25rem}
.stat-accent-1{color:var(--acc)}
.stat-accent-2{color:var(--blue)}
.stat-accent-3{color:var(--green)}
.stat-accent-4{color:var(--gold)}
.stat-accent-5{color:var(--purple)}
.recently-watched{margin-top:2rem}
.rw-list{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.rw-item{
  display:flex;align-items:center;gap:1rem;background:var(--s2);
  border-radius:var(--r);padding:.75rem 1rem;
}
.rw-poster{width:36px;height:54px;border-radius:5px;object-fit:cover;background:var(--s3);flex-shrink:0}
.rw-info{flex:1;min-width:0}
.rw-title{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-date{font-size:.72rem;color:var(--t3);margin-top:.2rem}
.rw-pct{font-size:.72rem;color:var(--t2);flex-shrink:0}

/* ── NOTE MODAL ── */
.note-modal-overlay{
  position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.note-modal-overlay.open{opacity:1;pointer-events:all}
.note-modal{
  background:var(--s1);border:1px solid rgba(255,255,255,.08);border-radius:var(--r3);
  padding:1.75rem;width:480px;max-width:90vw;
  transform:scale(.95);transition:transform .2s;
}
.note-modal-overlay.open .note-modal{transform:scale(1)}
.note-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.note-title{font-size:1rem;font-weight:700}
.note-textarea{
  width:100%;background:var(--s3);border:1px solid rgba(255,255,255,.08);color:var(--t1);
  border-radius:var(--r);padding:.85rem 1rem;font-family:var(--font);font-size:.85rem;
  resize:vertical;min-height:100px;outline:none;transition:border-color .15s;
}
.note-textarea:focus{border-color:rgba(232,68,90,.4)}
.note-actions{display:flex;gap:.6rem;margin-top:1rem;justify-content:flex-end}
.btn-save{background:var(--acc);color:white;border:none;padding:.6rem 1.4rem;border-radius:var(--r);font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-save:hover{background:var(--acc2)}
.btn-cancel{background:var(--s3);color:var(--t2);border:none;padding:.6rem 1.2rem;border-radius:var(--r);font-size:.85rem;cursor:pointer;transition:all .15s}
.btn-cancel:hover{background:var(--s4);color:var(--t1)}

/* ── PLAYER ── */
.player-modal{
  position:fixed;inset:0;z-index:1000;background:#000;
  opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;flex-direction:column;
}
.player-modal.open{opacity:1;pointer-events:all}
.player-topbar{
  position:absolute;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:1rem;padding:1.25rem 1.5rem;
  background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);
  opacity:0;transition:opacity .2s;
}
.player-modal.controls-visible .player-topbar{opacity:1}
.player-topbar:hover{opacity:1}
.btn-close-player{
  background:rgba(255,255,255,.1);border:none;color:white;
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;
}
.btn-close-player:hover{background:rgba(255,255,255,.2)}
.player-info{flex:1}
.player-main-title{font-size:.95rem;font-weight:700}
.player-sub-title{font-size:.78rem;color:rgba(255,255,255,.5);margin-top:.1rem}
.player-top-actions{display:flex;gap:.5rem;align-items:center}
.player-action-btn{
  background:rgba(255,255,255,.1);border:none;color:white;padding:.4rem .8rem;
  border-radius:20px;font-size:.72rem;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:.3rem;font-family:var(--font);font-weight:600;
}
.player-action-btn:hover{background:rgba(255,255,255,.2)}
.player-action-btn.active{background:rgba(46,204,113,.3);color:var(--green)}
video{width:100%;height:100%;object-fit:contain;background:#000}
.player-bottombar{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:1rem 1.5rem 1.5rem;
  background:linear-gradient(to top,rgba(0,0,0,.9),transparent);
  opacity:0;transition:opacity .2s;
}
.player-modal.controls-visible .player-bottombar{opacity:1}
.player-bottombar:hover{opacity:1}
.player-seek{
  width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;
  cursor:pointer;margin-bottom:.75rem;position:relative;appearance:none;
}
.player-seek::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:white;cursor:pointer}
.player-controls-row{display:flex;align-items:center;gap:1rem}
.player-time{font-size:.78rem;color:rgba(255,255,255,.7);min-width:100px}
.player-vol-row{display:flex;align-items:center;gap:.5rem;margin-left:auto}
.player-vol{width:80px;height:3px;cursor:pointer;accent-color:white}
.player-kbd{font-size:.68rem;color:rgba(255,255,255,.3);margin-left:auto}
.kbd{background:rgba(255,255,255,.1);padding:.1rem .35rem;border-radius:3px;font-family:monospace}

/* ── SETTINGS MODAL ── */
.modal-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--s1);border:1px solid rgba(255,255,255,.08);border-radius:var(--r3);
  padding:2rem;width:540px;max-width:92vw;
  transform:translateY(20px);transition:transform .2s;max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem}
.modal-title{font-size:1.25rem;font-weight:800}
.btn-x{background:var(--s3);border:none;color:var(--t2);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.btn-x:hover{background:var(--s4);color:var(--t1)}
.dir-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.25rem}
.dir-item{display:flex;align-items:center;gap:.75rem;background:var(--s2);border-radius:var(--r);padding:.75rem 1rem}
.dir-path{flex:1;font-size:.82rem;color:var(--t2);word-break:break-all}
.btn-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:.25rem;border-radius:4px;transition:color .15s;font-size:.9rem}
.btn-del:hover{color:var(--acc)}
.add-row{display:flex;gap:.6rem}
.dir-in{
  flex:1;background:var(--s2);border:1px solid rgba(255,255,255,.07);color:var(--t1);
  border-radius:var(--r);padding:.65rem 1rem;font-size:.82rem;font-family:var(--font);outline:none;
  transition:border-color .15s;
}
.dir-in:focus{border-color:rgba(232,68,90,.4)}
.dir-in::placeholder{color:var(--t3)}
.btn-add{background:var(--acc);color:white;border:none;padding:.65rem 1.25rem;border-radius:var(--r);font-weight:700;cursor:pointer;transition:all .15s;font-size:.82rem;white-space:nowrap}
.btn-add:hover{background:var(--acc2)}
.dir-err{color:var(--acc);font-size:.78rem;margin-top:.5rem}
.modal-tip{margin-top:1.25rem;font-size:.75rem;color:var(--t3);line-height:1.7;background:var(--s2);padding:.85rem 1rem;border-radius:var(--r);border-left:3px solid rgba(232,68,90,.4)}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:1.5rem;text-align:center;padding:2rem}
.empty-icon{font-size:6rem;opacity:.1}
.empty-title{font-size:2rem;font-weight:800;opacity:.4}
.empty-desc{color:var(--t3);max-width:360px;line-height:1.7;font-size:.9rem}
.btn-primary{background:var(--acc);color:white;border:none;padding:.8rem 1.75rem;border-radius:var(--r);font-weight:700;font-size:.9rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.5rem}
.btn-primary:hover{background:var(--acc2);transform:scale(1.02)}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:1rem}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.05);border-top-color:var(--acc);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:.82rem;color:var(--t3)}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:3000;display:flex;flex-direction:column;gap:.5rem;align-items:flex-end}
.toast{
  background:var(--s2);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);
  padding:.75rem 1.1rem;font-size:.82rem;
  transform:translateX(120%);opacity:0;transition:all .25s;
  max-width:300px;display:flex;align-items:center;gap:.6rem;
}
.toast.show{transform:translateX(0);opacity:1}
.toast.success{border-color:rgba(46,204,113,.3)}
.toast.info{border-color:rgba(74,158,255,.3)}

/* ── MISC ── */
.no-results{text-align:center;padding:4rem;color:var(--t3);font-size:.9rem}
.poster-img-anim{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

@media(max-width:768px){
  .hero{height:380px}.hero-title{font-size:2rem}.hero-poster-side{width:140px;right:3%}
  .media-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  header{padding:0 1rem}.grid-section,.continue-section{padding:1.5rem 1rem 0}
  nav .nav-btn{font-size:.7rem;padding:.4rem .6rem}
  .btn-surprise span{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showView('home')">Media<span>Box</span></div>
  <nav>
    <button class="nav-btn active" id="nav-home" onclick="showView('home')">Accueil</button>
    <button class="nav-btn" id="nav-movies" onclick="showView('movies')">Films</button>
    <button class="nav-btn" id="nav-series" onclick="showView('series')">Séries</button>
    <button class="nav-btn" id="nav-favorites" onclick="showView('favorites')">Favoris ★</button>
    <button class="nav-btn" id="nav-stats" onclick="showView('stats')">Stats</button>
  </nav>
  <div class="header-right">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Rechercher…" oninput="handleSearch(this.value)">
    </div>
    <button class="btn-surprise" onclick="playSurprise()" title="Film / épisode aléatoire">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.5 2.2"/><path d="M22 18h-5.9c-1.3 0-2.5-.6-3.3-1.7l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      <span>Surprise</span>
    </button>
    <button class="btn-src" onclick="openSettings()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      Sources
    </button>
  </div>
</header>

<main id="app">
  <div class="loading"><div class="spinner"></div><div class="load-text">Chargement…</div></div>
</main>

<!-- PLAYER -->
<div class="player-modal" id="player-modal">
  <div class="player-topbar" id="player-topbar">
    <button class="btn-close-player" onclick="closePlayer()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="player-info">
      <div class="player-main-title" id="player-main-title"></div>
      <div class="player-sub-title" id="player-sub-title"></div>
    </div>
    <div class="player-top-actions">
      <button class="player-action-btn" id="player-watched-btn" onclick="toggleWatchedFromPlayer()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
        Marquer vu
      </button>
      <button class="player-action-btn" id="player-note-btn" onclick="openNoteFromPlayer()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Note
      </button>
    </div>
  </div>
  <video id="video-player" controls preload="metadata"></video>
  <div class="player-bottombar" id="player-bottombar">
    <div class="player-controls-row">
      <span class="player-time" id="player-time">0:00 / 0:00</span>
      <span class="player-vol-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:rgba(255,255,255,.5)"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19 11,5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <input type="range" class="player-vol" id="player-vol" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
      </span>
      <span class="player-kbd"><kbd class="kbd">Espace</kbd> pause · <kbd class="kbd">←→</kbd> ±10s · <kbd class="kbd">F</kbd> plein écran · <kbd class="kbd">M</kbd> muet</span>
    </div>
  </div>
</div>

<!-- NOTE MODAL -->
<div class="note-modal-overlay" id="note-modal" onclick="closeNoteOnBackdrop(event)">
  <div class="note-modal">
    <div class="note-header">
      <div class="note-title" id="note-modal-title">Ma note</div>
      <button class="btn-x" onclick="closeNote()">✕</button>
    </div>
    <textarea class="note-textarea" id="note-textarea" placeholder="Tes impressions, score, citations…"></textarea>
    <div class="note-actions">
      <button class="btn-cancel" onclick="closeNote()">Annuler</button>
      <button class="btn-save" onclick="saveNote()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="modal-overlay" id="settings-modal" onclick="closeSettingsBackdrop(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Sources Média</div>
      <button class="btn-x" onclick="closeSettings()">✕</button>
    </div>
    <div class="dir-list" id="dir-list"></div>
    <div class="add-row">
      <input type="text" class="dir-in" id="dir-input" placeholder="/home/user/Films" onkeydown="if(event.key==='Enter')addDir()">
      <button class="btn-add" onclick="addDir()">+ Ajouter</button>
    </div>
    <div class="dir-err" id="dir-error"></div>
    <div class="modal-tip">💡 Entrez le chemin absolu vers un dossier. Les sous-dossiers sont scannés automatiquement.<br>Les affiches sont récupérées depuis TMDB (connexion internet nécessaire).</div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
var library={movies:[],series:[]};
var config={mediaDirs:[],watchedFiles:{},favorites:[],notes:{}};
var currentView='home';
var searchQuery='';
var currentVideoId=null;
var currentVideoTitle='';
var progressTimer=null;
var controlsTimer=null;
var expandedShows={};
var activeSeasons={};
var mediaRegistry={}; // id -> {id,title,meta,type}
var posterQueue=[];
var posterFetching=false;
var sortMode={movies:'alpha',series:'alpha'};

// ─── CLICK DELEGATION ─────────────────────────────────────────────────────────
document.addEventListener('click',function(e){
  var card=e.target.closest('[data-play-id]');
  if(card&&!e.target.closest('[data-no-play]')){
    var id=card.dataset.playId;
    var info=mediaRegistry[id];
    if(info) playMedia(info.id,info.title,info.meta);
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){await loadLibrary();}

async function loadLibrary(){
  document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div><div class="load-text">Chargement de la bibliothèque…</div></div>';
  try{
    var res=await fetch('/api/library');
    var data=await res.json();
    library=data;
    config=data.config||{mediaDirs:[],watchedFiles:{},favorites:[],notes:{}};
    if(!config.notes) config.notes={};
  }catch(e){
    library={movies:[],series:[]};
    config={mediaDirs:[],watchedFiles:{},favorites:[],notes:{}};
  }
  render();
  schedulePosterFetch();
}

// ─── POSTER QUEUE ─────────────────────────────────────────────────────────────
function schedulePosterFetch(){
  var all=[];
  (library.movies||[]).forEach(function(m){if(!m.poster) all.push({id:m.id,title:m.title,year:m.year,type:'movie'});});
  (library.series||[]).forEach(function(s){if(!s.poster) all.push({id:s.id,title:s.showName,year:null,type:'tv'});});
  posterQueue=all;
  fetchNextPoster();
}

async function fetchNextPoster(){
  if(posterFetching||posterQueue.length===0) return;
  posterFetching=true;
  var item=posterQueue.shift();
  try{
    var res=await fetch('/api/poster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,title:item.title,year:item.year,type:item.type})});
    var data=await res.json();
    if(data.poster){
      // Update in library
      if(item.type==='movie'){
        var m=(library.movies||[]).find(function(x){return x.id===item.id;});
        if(m){m.poster=data.poster;Object.assign(m,data.meta||{});}
      }else{
        var s=(library.series||[]).find(function(x){return x.id===item.id;});
        if(s){s.poster=data.poster;Object.assign(s,data.meta||{});}
      }
      // Update DOM if card is visible
      var imgEl=document.getElementById('poster-'+item.id);
      if(imgEl){imgEl.src=data.poster;imgEl.style.display='block';var ph=document.getElementById('ph-'+item.id);if(ph)ph.style.display='none';}
    }
  }catch(e){}
  posterFetching=false;
  setTimeout(fetchNextPoster,300);
}

// ─── THUMBNAIL FETCH ──────────────────────────────────────────────────────────
async function fetchThumb(id){
  try{
    var res=await fetch('/api/thumbnail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    var data=await res.json();
    if(data.thumb){
      var el=document.getElementById('thumb-'+id);
      if(el){el.src=data.thumb;el.style.display='block';}
    }
  }catch(e){}
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  if(currentView==='stats'){renderStats();return;}
  var app=document.getElementById('app');
  var movies=applySort((library.movies||[]).slice(),'movies');
  var series=applySort((library.series||[]).slice(),'series');

  if(searchQuery){
    var q=searchQuery.toLowerCase();
    movies=movies.filter(function(m){return (m.title||'').toLowerCase().includes(q);});
    series=series.filter(function(s){return (s.showName||'').toLowerCase().includes(q);});
  }
  if(currentView==='favorites'){
    var favIds=new Set(config.favorites||[]);
    movies=movies.filter(function(m){return favIds.has(m.id);});
    series=series.filter(function(s){return Object.values(s.seasons||{}).flat().some(function(e){return favIds.has(e.id);});});
  }
  ['home','movies','series','favorites','stats'].forEach(function(v){
    var el=document.getElementById('nav-'+v);if(el)el.classList.toggle('active',currentView===v);
  });

  var html='';
  var isEmpty=movies.length===0&&series.length===0;
  if(isEmpty&&(config.mediaDirs||[]).length===0){app.innerHTML=renderEmpty();return;}

  // Hero
  if(currentView==='home'&&!searchQuery){
    var heroItem=movies[0]||(series[0]?Object.values(series[0].seasons||{}).flat()[0]:null);
    var heroShow=movies[0]?null:series[0];
    if(heroItem) html+=renderHero(heroItem,heroShow);
  }

  // Continue watching
  if((currentView==='home'||currentView==='movies'||currentView==='series')&&!searchQuery){
    var continueItems=getContinueWatching(movies,series);
    if(continueItems.length>0) html+=renderContinueRow(continueItems);
  }

  // Movies
  if((currentView==='home'||currentView==='movies')&&movies.length>0){
    html+='<div class="grid-section"><div class="section-header">'
      +'<div class="section-title">Films <span class="section-count">'+movies.length+'</span></div>'
      +'<select class="sort-select" onchange="setSort(\'movies\',this.value)">'
      +'<option value="alpha" '+(sortMode.movies==='alpha'?'selected':'')+'>A–Z</option>'
      +'<option value="year" '+(sortMode.movies==='year'?'selected':'')+'>Année</option>'
      +'<option value="recent" '+(sortMode.movies==='recent'?'selected':'')+'>Récents</option>'
      +'<option value="unwatched" '+(sortMode.movies==='unwatched'?'selected':'')+'>Non vus</option>'
      +'</select></div>'
      +'<div class="media-grid">';
    movies.forEach(function(m){html+=renderMovieCard(m);});
    html+='</div></div>';
  }

  // Series
  if((currentView==='home'||currentView==='series'||currentView==='favorites')&&series.length>0){
    html+='<div class="grid-section"><div class="section-header">'
      +'<div class="section-title">Séries <span class="section-count">'+series.length+'</span></div>'
      +'<select class="sort-select" onchange="setSort(\'series\',this.value)">'
      +'<option value="alpha" '+(sortMode.series==='alpha'?'selected':'')+'>A–Z</option>'
      +'<option value="progress" '+(sortMode.series==='progress'?'selected':'')+'>En cours</option>'
      +'</select></div>'
      +'</div>';
    series.forEach(function(s){html+=renderSeriesBlock(s);});
  }

  if(isEmpty&&searchQuery) html='<div class="no-results">Aucun résultat pour "'+escHtml(searchQuery)+'"</div>';

  app.innerHTML=html;
}

function applySort(arr,type){
  var mode=sortMode[type]||'alpha';
  if(type==='movies'){
    if(mode==='alpha') arr.sort(function(a,b){return (a.title||'').localeCompare(b.title||'');});
    else if(mode==='year') arr.sort(function(a,b){return (b.year||0)-(a.year||0);});
    else if(mode==='recent') arr.sort(function(a,b){return new Date(b.mtime)-new Date(a.mtime);});
    else if(mode==='unwatched') arr.sort(function(a,b){var wa=!!(config.watchedFiles&&config.watchedFiles[a.id]&&config.watchedFiles[a.id].watchedAt);var wb=!!(config.watchedFiles&&config.watchedFiles[b.id]&&config.watchedFiles[b.id].watchedAt);return wa-wb;});
  }else{
    if(mode==='alpha') arr.sort(function(a,b){return (a.showName||'').localeCompare(b.showName||'');});
    else if(mode==='progress'){
      arr.sort(function(a,b){
        var aHas=Object.values(a.seasons||{}).flat().some(function(e){return config.watchedFiles&&config.watchedFiles[e.id]&&config.watchedFiles[e.id].progress>0&&!config.watchedFiles[e.id].watchedAt;});
        return aHas?-1:1;
      });
    }
  }
  return arr;
}
function setSort(type,val){sortMode[type]=val;render();}

function getContinueWatching(movies,series){
  var items=[];
  movies.forEach(function(m){
    var w=config.watchedFiles&&config.watchedFiles[m.id];
    if(w&&w.progress>60&&w.duration>0&&w.progress/w.duration<0.95&&!w.watchedAt) items.push({...m,pct:Math.round(w.progress/w.duration*100),contTitle:m.title,contMeta:'Film'});
  });
  series.forEach(function(s){
    Object.values(s.seasons||{}).flat().forEach(function(ep){
      var w=config.watchedFiles&&config.watchedFiles[ep.id];
      if(w&&w.progress>30&&w.duration>0&&w.progress/w.duration<0.95&&!w.watchedAt)
        items.push({...ep,poster:s.poster,pct:Math.round(w.progress/w.duration*100),contTitle:s.showName,contMeta:'S'+pad(ep.season)+'E'+pad(ep.episode)});
    });
  });
  items.sort(function(a,b){return new Date(b.mtime||0)-new Date(a.mtime||0);});
  return items.slice(0,12);
}

// ─── HERO ─────────────────────────────────────────────────────────────────────
function renderHero(item,show){
  var title=show?show.showName:(item.title||'');
  var tag=show?'Série':'Film';
  var year=item.year||'';
  var poster=show?show.poster:item.poster;
  var rating=show?(show.rating||item.rating):(item.rating);
  var overview=show?(show.overview||''):(item.overview||'');
  var id=item.id;
  mediaRegistry[id]={id,title,meta:year?String(year):'',type:tag};
  var watched=config.watchedFiles&&config.watchedFiles[id];
  var isFav=(config.favorites||[]).includes(id);
  var isWatched=watched&&watched.watchedAt;
  var note=config.notes&&config.notes[id];
  return '<div class="hero" id="hero-root">'
    +'<div class="hero-backdrop" id="hero-backdrop"></div>'
    +'<div class="hero-gradient"></div>'
    +'<div class="hero-gradient-bottom"></div>'
    +(poster?'<div class="hero-poster-side"><img src="'+escHtml(poster)+'" onerror="this.parentElement.innerHTML=\'<div class=hero-poster-placeholder>🎬</div>\'"></div>':'<div class="hero-poster-side"><div class="hero-poster-placeholder">🎬</div></div>')
    +'<div class="hero-content">'
    +'<div class="hero-badge"><span class="hero-tag">'+tag+'</span>'+(rating?'<span class="hero-rating"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>'+rating.toFixed(1)+'</span>':'')+'</div>'
    +'<div class="hero-title">'+escHtml(title)+'</div>'
    +(overview?'<div class="hero-overview">'+escHtml(overview)+'</div>':'')

// ─── SURPRISE ─────────────────────────────────────────────────────────────────
function playSurprise(){
  var all=[];
  var unwatchedMovies=(library.movies||[]).filter(function(m){var w=config.watchedFiles&&config.watchedFiles[m.id];return !w||!w.watchedAt;});
  var allEps=(library.series||[]).flatMap(function(s){return Object.values(s.seasons||{}).flat();});
  var unwatchedEps=allEps.filter(function(ep){var w=config.watchedFiles&&config.watchedFiles[ep.id];return !w||!w.watchedAt;});
  all=unwatchedMovies.concat(unwatchedEps);
  if(all.length===0) all=(library.movies||[]).concat(allEps);
  if(all.length===0){showToast('Bibliothèque vide !','info');return;}
  var pick=all[Math.floor(Math.random()*all.length)];
  var info=mediaRegistry[pick.id];
  if(!info){
    // build info on the fly
    var show=(library.series||[]).find(function(s){return Object.values(s.seasons||{}).flat().some(function(e){return e.id===pick.id;});});
    info={id:pick.id,title:show?show.showName:(pick.title||''),meta:show?'S'+pad(pick.season||1)+'E'+pad(pick.episode||1):''};
  }
  showToast('🎲 '+info.title+(info.meta?' · '+info.meta:''),'info');
  setTimeout(function(){playMedia(info.id,info.title,info.meta);},600);
}

// ─── PLAYER ───────────────────────────────────────────────────────────────────
function playMedia(id,title,meta){
  var modal=document.getElementById('player-modal');
  var video=document.getElementById('video-player');
  currentVideoId=id;
  currentVideoTitle=title;
  document.getElementById('player-main-title').textContent=title;
  document.getElementById('player-sub-title').textContent=meta||'';
  modal.classList.add('open');

  var allEps=(library.series||[]).flatMap(function(s){return Object.values(s.seasons||{}).flat();});
  var allMedia=(library.movies||[]).concat(allEps);
  var item=allMedia.find(function(m){return m.id===id;});

  var saved=config.watchedFiles&&config.watchedFiles[id];
  var startAt=(saved&&saved.progress>10&&saved.duration>0&&saved.progress/saved.duration<0.95)?saved.progress:0;

  while(video.firstChild) video.removeChild(video.firstChild);
  if(item&&item.subtitles&&item.subtitles.length>0){
    item.subtitles.forEach(function(sub){
      var t=document.createElement('track');t.kind='subtitles';t.label=sub.label;
      t.src='/api/subtitle?id='+encodeURIComponent(sub.id);video.appendChild(t);
    });
  }

  var needsTranscode=item&&item.needsTranscode;
  var url='/api/stream?id='+encodeURIComponent(id);
  if(needsTranscode&&startAt>10) url+='&t='+Math.floor(startAt);
  video.src=url;
  if(!needsTranscode&&startAt>10){
    video.addEventListener('loadedmetadata',function(){if(video.duration>0&&startAt<video.duration-30)video.currentTime=startAt;},{once:true});
  }

  video.play().catch(function(){});
  document.title=title+' — MediaBox';
  modal.classList.add('controls-visible');

  // Update watched btn state
  updatePlayerWatchedBtn(id);

  clearInterval(progressTimer);
  progressTimer=setInterval(function(){
    if(!video.paused&&!video.ended&&video.duration>0){
      saveProgress(id,video.currentTime,video.duration);
      updatePlayerTime(video.currentTime,video.duration);
    }
  },3000);

  video.addEventListener('timeupdate',function(){updatePlayerTime(video.currentTime,video.duration);});
  video.addEventListener('ended',function(){
    markWatched(id,video.duration,true);
    clearInterval(progressTimer);
    showToast('✓ Terminé — marqué comme vu','success');
  },{once:true});

  // Auto-hide controls
  setupControlsAutoHide(modal,video);
}

function updatePlayerTime(t,d){
  var el=document.getElementById('player-time');
  if(el) el.textContent=fmtTime(t)+' / '+fmtTime(d);
}
function updatePlayerWatchedBtn(id){
  var btn=document.getElementById('player-watched-btn');
  if(!btn) return;
  var w=config.watchedFiles&&config.watchedFiles[id];
  if(w&&w.watchedAt){btn.classList.add('active');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg> Vu ✓';}
  else{btn.classList.remove('active');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg> Marquer vu';}
}
function toggleWatchedFromPlayer(){
  if(!currentVideoId) return;
  var video=document.getElementById('video-player');
  toggleWatchedById(currentVideoId,video.duration||0);
  updatePlayerWatchedBtn(currentVideoId);
}
function openNoteFromPlayer(){if(currentVideoId) openNote(currentVideoId,currentVideoTitle);}

function setupControlsAutoHide(modal,video){
  clearTimeout(controlsTimer);
  function show(){modal.classList.add('controls-visible');clearTimeout(controlsTimer);controlsTimer=setTimeout(function(){if(!video.paused) modal.classList.remove('controls-visible');},3000);}
  modal.addEventListener('mousemove',show);
  modal.addEventListener('touchstart',show);
  video.addEventListener('pause',function(){modal.classList.add('controls-visible');clearTimeout(controlsTimer);});
  video.addEventListener('play',function(){show();});
}

function setVolume(v){var video=document.getElementById('video-player');if(video) video.volume=parseFloat(v);}

function closePlayer(){
  var modal=document.getElementById('player-modal');
  var video=document.getElementById('video-player');
  modal.classList.remove('open','controls-visible');
  if(!video.paused) video.pause();
  if(currentVideoId&&video.currentTime>10) saveProgress(currentVideoId,video.currentTime,video.duration);
  video.src='';clearInterval(progressTimer);clearTimeout(controlsTimer);
  document.title='MediaBox';render();
}

// ─── WATCHED ──────────────────────────────────────────────────────────────────
async function toggleWatched(id,btn){toggleWatchedById(id,0);if(btn){var w=config.watchedFiles&&config.watchedFiles[id];btn.textContent=w&&w.watchedAt?'✓':'○';btn.classList.toggle('is-watched',!!(w&&w.watchedAt));btn.classList.toggle('active',!!(w&&w.watchedAt));}}
async function toggleWatchedById(id,duration){
  var w=config.watchedFiles&&config.watchedFiles[id];
  var isWatched=w&&w.watchedAt;
  if(isWatched){
    await fetch('/api/watched',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action:'remove'})});
    if(config.watchedFiles) delete config.watchedFiles[id];
    showToast('Retiré des vus');
  }else{
    await markWatched(id,duration||0,false);
    showToast('✓ Marqué comme vu','success');
  }
  // Update card badge in DOM without full re-render
  var watched=config.watchedFiles&&config.watchedFiles[id];
  var badgeEl=document.querySelector('.media-card[data-play-id="'+id+'"] .badge-watched');
  if(watched&&watched.watchedAt&&!badgeEl){/* soft refresh */render();}
  else if(!watched) render();
}

async function markWatched(id,duration,silent){
  try{
    await fetch('/api/watched',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,progress:Math.floor(duration),duration:Math.floor(duration)})});
    if(!config.watchedFiles) config.watchedFiles={};
    config.watchedFiles[id]={watchedAt:new Date().toISOString(),progress:Math.floor(duration),duration:Math.floor(duration)};
  }catch(e){}
}

async function saveProgress(id,t,d){
  try{
    var res=await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,progress:Math.floor(t),duration:Math.floor(d)})});
    var data=await res.json();
    if(!config.watchedFiles) config.watchedFiles={};
    if(!config.watchedFiles[id]) config.watchedFiles[id]={};
    config.watchedFiles[id].progress=Math.floor(t);
    config.watchedFiles[id].duration=Math.floor(d);
    // Auto-mark at 80%
    if(data.autoMarked&&!config.watchedFiles[id].watchedAt){
      config.watchedFiles[id].watchedAt=new Date().toISOString();
      showToast('✓ Auto-marqué vu (80%)','success');
      updatePlayerWatchedBtn(id);
    }
  }catch(e){}
}

// ─── FAVORITES ────────────────────────────────────────────────────────────────
async function toggleFav(id,btn){
  var isFav=(config.favorites||[]).includes(id);
  var action=isFav?'remove':'add';
  try{
    var res=await fetch('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});
    var data=await res.json();
    config.favorites=data.favorites;
    showToast(action==='add'?'★ Favori ajouté':'Retiré des favoris');
    if(btn){btn.textContent=action==='add'?'★ Favoris':'☆ Favoris';btn.classList.toggle('fav-active',action==='add');btn.classList.toggle('is-fav',action==='add');}
  }catch(e){}
}

// ─── NOTES ────────────────────────────────────────────────────────────────────
var noteCurrentId=null;
function openNote(id,title,existingNote){
  noteCurrentId=id;
  document.getElementById('note-modal-title').textContent='Note — '+title;
  document.getElementById('note-textarea').value=existingNote||(config.notes&&config.notes[id])||'';
  document.getElementById('note-modal').classList.add('open');
  setTimeout(function(){document.getElementById('note-textarea').focus();},100);
}
function openNoteById(id){var info=mediaRegistry[id];if(info) openNote(id,info.title);}
function closeNote(){document.getElementById('note-modal').classList.remove('open');noteCurrentId=null;}
function closeNoteOnBackdrop(e){if(e.target===e.currentTarget) closeNote();}
async function saveNote(){
  if(!noteCurrentId) return;
  var note=document.getElementById('note-textarea').value.trim();
  try{
    await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:noteCurrentId,note:note||null})});
    if(!config.notes) config.notes={};
    if(note) config.notes[noteCurrentId]=note;else delete config.notes[noteCurrentId];
    showToast('📝 Note enregistrée','success');
  }catch(e){}
  closeNote();
}

// ─── SETTINGS ─────────────────────────────────────────────────────────────────
function openSettings(){renderDirList();document.getElementById('settings-modal').classList.add('open');}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open');}
function closeSettingsBackdrop(e){if(e.target===e.currentTarget) closeSettings();}
function renderDirList(){
  var dirs=config.mediaDirs||[];
  var el=document.getElementById('dir-list');
  if(dirs.length===0){el.innerHTML='<div style="color:var(--t3);font-size:.82rem;padding:.5rem 0">Aucun dossier configuré</div>';return;}
  el.innerHTML=dirs.map(function(d){
    return '<div class="dir-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);flex-shrink:0"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'
      +'<span class="dir-path">'+escHtml(d)+'</span>'
      +'<button class="btn-del" onclick="removeDir(\''+escJs(d)+'\')">✕</button></div>';
  }).join('');
}
async function addDir(){
  var input=document.getElementById('dir-input'),err=document.getElementById('dir-error');
  var dir=input.value.trim();if(!dir) return;err.textContent='';
  try{
    var res=await fetch('/api/config/dirs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir})});
    var data=await res.json();
    if(data.success){config=data.config;input.value='';renderDirList();showToast('Dossier ajouté !','success');await loadLibrary();}
    else err.textContent=data.error||'Erreur';
  }catch(e){err.textContent='Erreur de connexion';}
}
async function removeDir(dir){
  try{
    var res=await fetch('/api/config/dirs',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir})});
    var data=await res.json();
    if(data.success){config=data.config;renderDirList();await loadLibrary();}
  }catch(e){}
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  var modal=document.getElementById('player-modal');
  var isPlayerOpen=modal.classList.contains('open');
  var video=document.getElementById('video-player');
  var tag=document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='Escape'){
    if(isPlayerOpen) closePlayer();
    else if(document.getElementById('settings-modal').classList.contains('open')) closeSettings();
    else if(document.getElementById('note-modal').classList.contains('open')) closeNote();
    return;
  }
  if(!isPlayerOpen) return;
  if(e.key===' '||e.key==='k'){e.preventDefault();video.paused?video.play():video.pause();}
  else if(e.key==='ArrowRight'){video.currentTime=Math.min(video.duration,video.currentTime+10);}
  else if(e.key==='ArrowLeft'){video.currentTime=Math.max(0,video.currentTime-10);}
  else if(e.key==='ArrowUp'){video.volume=Math.min(1,video.volume+0.1);document.getElementById('player-vol').value=video.volume;}
  else if(e.key==='ArrowDown'){video.volume=Math.max(0,video.volume-0.1);document.getElementById('player-vol').value=video.volume;}
  else if(e.key==='f'||e.key==='F'){!document.fullscreenElement?modal.requestFullscreen():document.exitFullscreen();}
  else if(e.key==='m'||e.key==='M'){video.muted=!video.muted;}
  else if(e.key==='n'||e.key==='N'){openNoteFromPlayer();}
});

// ─── UTILS ────────────────────────────────────────────────────────────────────
var toastId=0;
function showToast(msg,type){
  var wrap=document.getElementById('toast-wrap');
  var id='toast-'+(++toastId);
  var div=document.createElement('div');
  div.className='toast '+(type||'');div.id=id;div.textContent=msg;
  wrap.appendChild(div);
  setTimeout(function(){div.classList.add('show');},10);
  setTimeout(function(){div.classList.remove('show');setTimeout(function(){if(div.parentNode) div.parentNode.removeChild(div);},300);},2800);
}
function formatSize(b){if(!b)return '';if(b>1e9)return (b/1e9).toFixed(1)+' Go';if(b>1e6)return (b/1e6).toFixed(0)+' Mo';return (b/1e3).toFixed(0)+' Ko';}
function fmtTime(s){if(!s||isNaN(s))return '0:00';var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);return (h>0?h+':':'')+pad(m)+':'+pad(sec);}
function fmtDuration(s){if(s<60)return Math.round(s)+'s';if(s<3600)return Math.round(s/60)+'min';if(s<86400)return (s/3600).toFixed(1)+'h';return (s/86400).toFixed(1)+' jours';}
function fmtDate(d){try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch{return '';}}
function pad(n){return String(n).padStart(2,'0');}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escJs(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

init();
</script>
